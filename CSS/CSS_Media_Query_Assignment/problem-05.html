<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem 3 - All Screen Layouts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 30px 20px;
      background-color: #f4f4f9;
    }

    /* Container for side-by-side layout previews */
    .preview-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #333;
    }

    /* Common layout box styles */
    .nav {
      background-color: #ffff00; /* Yellow */
      padding: 15px 20px;
      font-size: 1.8rem;
      color: #000;
      margin-bottom: 15px;
      font-weight: normal;
    }

    .box {
      padding: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      min-height: 220px;
    }

    .left-box {
      background-color: #ff0000; /* Red */
      color: #700000;
    }

    .right-box {
      background-color: #00ff00; /* Green */
      color: #005000;
    }

    /* 1. Large Screen View Preview */
    .large-card {
      width: 650px;
    }

    .large-content {
      display: flex;
      gap: 15px;
    }

    .large-content .box {
      flex: 1;
    }

    /* 2. Small Screen View Preview */
    .small-card {
      width: 380px;
    }

    .small-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .small-content .box {
      min-height: 160px;
    }
  </style>
</head>
<body>

  <div class="preview-container">

    <!-- Large Screen View -->
    <div class="card large-card">
      <h2>Large Screen</h2>
      <div class="nav">Navigation</div>
      <div class="large-content">
        <div class="box left-box">LEFT BOX</div>
        <div class="box right-box">RIGHT BOX</div>
      </div>
    </div>

    <!-- Small Screen View -->
    <div class="card small-card">
      <h2>Small Screen</h2>
      <div class="nav">Navigation</div>
      <div class="small-content">
        <div class="box left-box">LEFT BOX</div>
        <div class="box right-box">RIGHT BOX</div>
      </div>
    </div>

  </div>

</body>
</html>
