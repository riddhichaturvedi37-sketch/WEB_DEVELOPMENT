<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout Problem 5</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #dce1e7;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      grid-template-areas:
        "box1 box2 box2 box3"
        "box4 box4 box5 box6"
        "box7 box8 box9 box9";
      gap: 15px;
      width: 800px;
      height: 500px;
    }

    .box {
      background-color: #114b2d;
      border-radius: 8px;
    }

    .b1 { grid-area: box1; }
    .b2 { grid-area: box2; }
    .b3 { grid-area: box3; }
    .b4 { grid-area: box4; }
    .b5 { grid-area: box5; }
    .b6 { grid-area: box6; }
    .b7 { grid-area: box7; }
    .b8 { grid-area: box8; }
    .b9 { grid-area: box9; }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="box b1"></div>
    <div class="box b2"></div>
    <div class="box b3"></div>
    <div class="box b4"></div>
    <div class="box b5"></div>
    <div class="box b6"></div>
    <div class="box b7"></div>
    <div class="box b8"></div>
    <div class="box b9"></div>
  </div>

</body>
</html>
