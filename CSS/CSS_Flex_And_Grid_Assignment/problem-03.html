<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Layout - CSS Grid</title>
  <style>
    body {
      background-color: #00bcd4; /* cyan background */
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .keyboard {
      background-color: #222;
      border-radius: 15px;
      padding: 25px;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .key {
      background-color: #333;
      color: #00bcd4;
      font-weight: 600;
      text-transform: lowercase;
      border-radius: 6px;
      padding: 12px 0;
      text-align: center;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease;
    }

    .key:hover {
      transform: translateY(-3px);
      background-color: #444;
    }

    /* Special keys */
    .key.tab { grid-column: span 2; }
    .key.caps { grid-column: span 2; }
    .key.shift { grid-column: span 2; }
    .key.space { grid-column: span 6; }
    .key.enter { grid-column: span 2; }
    .key.delete { grid-column: span 2; }

    /* Bottom row alignment */
    .bottom-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .bottom-row .key {
      padding: 12px 0;
    }

    .key.arrow {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="keyboard">
    <!-- Row 1 -->
    <div class="key">~</div>
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key">0</div>
    <div class="key delete">delete</div>

    <!-- Row 2 -->
    <div class="key tab">tab</div>
    <div class="key">Q</div>
    <div class="key">W</div>
    <div class="key">E</div>
    <div class="key">R</div>
    <div class="key">T</div>
    <div class="key">Y</div>
    <div class="key">U</div>
    <div class="key">I</div>
    <div class="key">O</div>
    <div class="key">P</div>
    <div class="key">\</div>

    <!-- Row 3 -->
    <div class="key caps">caps</div>
    <div class="key">A</div>
    <div class="key">S</div>
    <div class="key">D</div>
    <div class="key">F</div>
    <div class="key">G</div>
    <div class="key">H</div>
    <div class="key">J</div>
    <div class="key">K</div>
    <div class="key">L</div>
    <div class="key enter">Enter</div>

    <!-- Row 4 -->
    <div class="key shift">Shift</div>
    <div class="key">Z</div>
    <div class="key">X</div>
    <div class="key">C</div>
    <div class="key">V</div>
    <div class="key">B</div>
    <div class="key">N</div>
    <div class="key">M</div>
    <div class="key">></div>
    <div class="key shift">Shift</div>

    <!-- Row 5 -->
    <div class="bottom-row">
      <div class="key">control</div>
      <div class="key">option</div>
      <div class="key">alt</div>
      <div class="key space">Space</div>
      <div class="key">alt</div>
      <div class="key">option</div>
      <div class="key arrow">←</div>
      <div class="key arrow">→</div>
    </div>
  </div>
</body>
</html>
