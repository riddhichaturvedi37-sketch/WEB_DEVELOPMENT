<!DOCTYPE html>
<html>
<head>
  <title>ByteXL Website Header</title>
    <style>
              * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #18181d;
        }
        header {
            width: 100%;
            background-color: #ffffff;
        }

         .navbar {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            gap: 25px;
        }

         .logo {
            color: #4b8b45;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

          .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            color: #222222;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
        }

        .nav-links a:hover,
        .categories a:hover {
            color: #4b8b45;
        }

         .signin {
            background-color: #314dbc;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px 17px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .signin:hover {
            background-color: #333333;
        }

         .divider {
            height: 1px;
            width: 100%;
            background-color: #eeeeee;
        }

         .sub-navbar {
            min-height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
        }

        .categories {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
            list-style: none;
        }

        .categories a {
            text-decoration: none;
            color: #333333;
            font-size: 13px;
            white-space: nowrap;
        }

          main {
            min-height: calc(100vh - 120px);
            background-color: #18181d;
        }

           @media (max-width: 900px) {
            .navbar {
                flex-wrap: wrap;
                justify-content: space-between;
                padding: 18px 20px;
                gap: 18px;
            }

            .nav-links {
                gap: 18px;
            }

            .sub-navbar {
                justify-content: flex-start;
                overflow-x: auto;
            }

            .categories {
                justify-content: flex-start;
                gap: 22px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: center;
            }

            .nav-links {
                flex-wrap: wrap;
                gap: 15px 22px;
            }

            .categories {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
          <nav class="navbar">

            <a href="#" class="logo">ByteXL</a>

            <ul class="nav-links">
                <li><a href="#">Courses</a></li>
                <li><a href="#">Tutorials</a></li>
                <li><a href="#">Practice</a></li>
                <li><a href="#">Jobs</a></li>
            </ul>

            <button class="signin">Sign In</button>

        </nav>
        <div class="divider"></div>
          <nav class="sub-navbar">
            <ul class="categories">
                <li><a href="#">DSA</a></li>
                <li><a href="#">Practice Problems</a></li>
                <li><a href="#">C</a></li>
                <li><a href="#">C++</a></li>
                <li><a href="#">Java</a></li>
                <li><a href="#">Python</a></li>
                <li><a href="#">JavaScript</a></li>
                <li><a href="#">Data Science</a></li>
                <li><a href="#">Machine Learning</a></li>
                <li><a href="#">Courses</a></li>
                <li><a href="#">Linux</a></li>
                <li><a href="#">DevOps</a></li>
            </ul>
        </nav>
    </header>
    <main></main>
</body>
</html>
