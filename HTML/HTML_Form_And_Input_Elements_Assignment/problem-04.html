<!DOCTYPE html>
<html>
<head>
  <title>Employee Leave Request Form</title>
</head>
<body>
  <h1>Employee Leave Request Form</h1>
  <p>
    Welcome to <strong>GLA University HR Portal</strong>.  
    Please fill out this form to request leave.  
    Fields marked with <mark>*</mark> are mandatory.
  </p>
  <hr>

  <form action="#" method="post">
    <h2>Employee Details</h2>
    <label for="name">Employee Name <mark>*</mark>:</label>
    <input type="text" id="name" name="empname" required minlength="3"><br><br>

    <label for="empid">Employee ID <mark>*</mark>:</label>
    <input type="text" id="empid" name="empid" pattern="[A-Z]{3}[0-9]{4}" placeholder="e.g., GLA1234" required><br><br>

    <label for="email">Email <mark>*</mark>:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="dept">Department <mark>*</mark>:</label>
    <select id="dept" name="department" required>
      <option value="">--Select Department--</option>
      <option value="Human Resources">Human Resources</option>
      <option value="Finance">Finance</option>
      <option value="IT Services">IT Services</option>
      <option value="Academic Administration">Academic Administration</option>
      <option value="Research & Development">Research & Development</option>
      <option value="Student Affairs">Student Affairs</option>
    </select><br><br>

    <hr>
