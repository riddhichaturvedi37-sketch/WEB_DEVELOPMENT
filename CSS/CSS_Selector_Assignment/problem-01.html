<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Listing Portal</title>
  <style>
    /* 1. Universal Selector */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* 2. Element Selector */
    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    h3 {
      font-size: 16px;
      font-weight: bold;
      color: #000;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
    }

    /* 3. ID Selector */
    #movie-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 850px;
      width: 100%;
    }

    /* 4. Class Selector */
    .movie-card {
      display: flex;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 12px;
      align-items: center;
      gap: 15px;
    }

    .poster {
      width: 100px;
      height: 120px;
      object-fit: cover;
      border-radius: 2px;
    }

    .movie-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 5. Grouping Selector */
    .btn-book, button {
      background-color: #d9383a;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
    }

    .btn-book:hover {
      background-color: #b82b2d;
    }
  </style>
</head>
<body>

  <div id="movie-container">
